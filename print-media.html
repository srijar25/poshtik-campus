<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Print Media Example</title>
    <style>
        @media print {
            nav {
                display: none;
            }

            body {
                background-color: white;
                color: black;
            }
        }
    </style>
</head>
<body>
    <nav>
        <a href="#">Home</a>
        <a href="#">Menu</a>
        <a href="#">About</a>
    </nav>

    <h1>Poshtik Campus</h1>
    <p>This page demonstrates CSS print media.</p>
</body>
</html>
