<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Form warm-up 2</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 24px; }
        label { display: block; margin-bottom: 6px; }
    </style>
</head>
<body>
    <form>
        <p>Pick your dish:</p>
        <input type="radio" id="d1" name="dish" value="ragi-idli">
        <label for="d1">Ragi Idli</label>

        <input type="radio" id="d2" name="dish" value="pesarattu">
        <label for="d2">Pesarattu</label>

        <input type="radio" id="d3" name="dish" value="millet-shake">
        <label for="d3">Millet Shake</label>
    </form>
</body>
</html>
