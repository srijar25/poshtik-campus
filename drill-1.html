<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Drill 1</title>
</head>
<body>
    <ul id="dish-names"></ul>
    <script>
        const dishNames = ["Ragi Idli Bowl", "Pesarattu with Sprouts", "Millet Protein Shake"];
        const list = document.getElementById("dish-names");

        dishNames.forEach(function (dishName)
        {
            const item = document.createElement("li");
            item.textContent = dishName;
            list.appendChild(item);
        });

        console.log("items on the page: " + list.children.length);
    </script>
</body>
</html>
