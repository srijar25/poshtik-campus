<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Drill 4</title>
</head>
<body>
    <form id="qty-form" novalidate>
        <input type="number" id="qty">
        <button type="submit">Check</button>
    </form>
    <p id="qty-result"></p>

    <script>
        const qtyForm = document.getElementById("qty-form");

        qtyForm.addEventListener("submit", function (event)
        {
            event.preventDefault();

            const quantity = Number(document.getElementById("qty").value);
            let message = "OK";

            if (!Number.isInteger(quantity) || quantity < 1 || quantity > 10)
            {
                message = "Quantity must be a whole number from 1 to 10.";
            }

            document.getElementById("qty-result").textContent = message;
            console.log(quantity + " -> " + message);
        });
    </script>
</body>
</html>
